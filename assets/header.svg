<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060907" />
      <stop offset="50%" stop-color="#07100a" />
      <stop offset="100%" stop-color="#050705" />
    </linearGradient>
    <linearGradient id="green-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#00FF66" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#16A34A" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B3D0B" />
      <stop offset="30%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="70%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0B3D0B" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16A34A" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>
  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: 4px; text-transform: uppercase; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; fill: #e2e8f0; }
    .badge-text { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; fill: #4ade80; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0% { opacity: 0.4; r: 4px; } 50% { opacity: 1; r: 6px; } 100% { opacity: 0.4; r: 4px; } }
  </style>
  <rect width="900" height="220" rx="14" fill="url(#bg-grad)" />
  <circle cx="150" cy="70" r="90" fill="#16A34A" opacity="0.18" filter="url(#ambient-blur)" />
  <circle cx="750" cy="120" r="110" fill="#00FF66" opacity="0.14" filter="url(#ambient-blur)" />
  <rect width="900" height="220" rx="14" fill="url(#tech-grid)" />
  <rect x="1.5" y="1.5" width="897" height="217" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.65" />
  <path d="M 12 30 L 12 14 L 30 14" stroke="#00FF66" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 888 30 L 888 14 L 870 14" stroke="#00FF66" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 12 190 L 12 206 L 30 206" stroke="#00FF66" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 888 190 L 888 206 L 870 206" stroke="#00FF66" stroke-width="3" fill="none" stroke-linecap="round" />
  <g transform="translate(275, 24)">
    <rect width="350" height="26" rx="13" fill="#08130a" stroke="#00FF66" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="18" cy="13" r="5" fill="#16A34A" class="pulse-dot" />
    <text x="185" y="17.5" text-anchor="middle" class="badge-text">CRAFTING SEAMLESS USER EXPERIENCES</text>
  </g>
  <text x="450" y="105" text-anchor="middle" class="title-text" fill="url(#green-glow-grad)" filter="url(#glow-green)">PRATYUSH DUBEY</text>
  <text x="450" y="105" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">PRATYUSH DUBEY</text>
  <text x="450" y="142" text-anchor="middle" class="subtitle-text">
    <tspan fill="#4ade80">FRONTEND ENGINEER</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#f1f5f9">REACT &amp; NEXT.JS</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#4ade80">UI PERFORMANCE</tspan>
  </text>
  <g transform="translate(0, 160)">
    <line x1="200" y1="0" x2="420" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
    <polygon points="450,-5 455,0 450,5 445,0" fill="#00FF66" filter="url(#glow-green)" />
    <line x1="480" y1="0" x2="700" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
  </g>
  <g transform="translate(450, 192)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      <tspan fill="#00FF66">&lt;/&gt;</tspan> CRAFTING SEAMLESS, PERFORMANT WEB EXPERIENCES
    </text>
  </g>
</svg>
